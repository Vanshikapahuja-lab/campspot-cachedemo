pipeline:
  name: dlc-demo-3-full-solution
  identifier: dlc_demo_3_full_solution
  projectIdentifier: YOUR_PROJECT_ID
  orgIdentifier: YOUR_ORG_ID
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: YOUR_CODE_REPO_CONNECTOR_ID
        repoName: YOUR_REPO_NAME
        build: <+input>
  stages:
    - parallel:
        - stage:
            name: Build app-a
            identifier: Build_app_a_parallel
            description: Caching on, cache mount on, its own runner.
            type: CI
            spec:
              cloneCodebase: true
              caching:
                enabled: true
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Build app-a (cached + parallel)
                      identifier: build_app_a_full
                      spec:
                        connectorRef: YOUR_GHCR_CONNECTOR_ID
                        repo: ghcr.io/YOUR_GITHUB_USERNAME/dlc-demo-app-a
                        dockerfile: app-a/Dockerfile.cachemount
                        context: app-a
                        caching: true
                        tags:
                          - full-<+pipeline.sequenceId>
                        envVariables:
                          PLUGIN_NO_PUSH: "true"
                          PLUGIN_BUILDX_OPTIONS: "--build-arg BUILDKIT_INLINE_CACHE=1"
        - stage:
            name: Build app-b
            identifier: Build_app_b_parallel
            description: Caching on, cache mount on, its own runner.
            type: CI
            spec:
              cloneCodebase: true
              caching:
                enabled: true
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Build app-b (cached + parallel)
                      identifier: build_app_b_full
                      spec:
                        connectorRef: YOUR_GHCR_CONNECTOR_ID
                        repo: ghcr.io/YOUR_GITHUB_USERNAME/dlc-demo-app-b
                        dockerfile: app-b/Dockerfile.cachemount
                        context: app-b
                        caching: true
                        tags:
                          - full-<+pipeline.sequenceId>
                        envVariables:
                          PLUGIN_NO_PUSH: "true"
                          PLUGIN_BUILDX_OPTIONS: "--build-arg BUILDKIT_INLINE_CACHE=1"
        - stage:
            name: Build app-c
            identifier: Build_app_c_parallel
            description: Caching on, cache mount on, its own runner.
            type: CI
            spec:
              cloneCodebase: true
              caching:
                enabled: true
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - step:
                      type: BuildAndPushDockerRegistry
                      name: Build app-c (cached + parallel)
                      identifier: build_app_c_full
                      spec:
                        connectorRef: YOUR_GHCR_CONNECTOR_ID
                        repo: ghcr.io/YOUR_GITHUB_USERNAME/dlc-demo-app-c
                        dockerfile: app-c/Dockerfile.cachemount
                        context: app-c
                        caching: true
                        tags:
                          - full-<+pipeline.sequenceId>
                        envVariables:
                          PLUGIN_NO_PUSH: "true"
                          PLUGIN_BUILDX_OPTIONS: "--build-arg BUILDKIT_INLINE_CACHE=1"
